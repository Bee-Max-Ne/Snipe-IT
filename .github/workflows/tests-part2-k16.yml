name: Tests Partition 2 (K16)

on:
  push:
    branches:
      - feat/test-quoc-part2
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  tests-part2-k16:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.5"

    name: PHP ${{ matrix.php-version }} (K16 Partition 2)

    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: none
          ini-values: memory_limit=1G

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.php-version }}-composer-

      - name: Copy .env
        run: |
          cp -v .env.testing.example .env
          cp -v .env.testing.example .env.testing

      - name: Create database file
        run: touch database/database.sqlite

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Setup Passport
        run: php artisan passport:keys

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Execute Partition 2 (K16) tests via PHPUnit
        env:
          LOG_CHANNEL: single
          LOG_LEVEL: debug
        run: vendor/bin/phpunit -c phpunit.part2.xml --no-progress --display-errors

      - name: Upload Laravel logs as artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: laravel-logs-part2-k16-php-${{ matrix.php-version }}-run-${{ github.run_attempt }}
          path: |
            storage/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
