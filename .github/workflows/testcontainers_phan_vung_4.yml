name: Testcontainers MySQL Part 4 Security Tests (Nguyen Thanh Minh - 2312691)

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  part4-security-tests:
    name: Part 4 Security & Multi-tenancy Tests (K16 Testcontainers MySQL 8.0.36)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: snipeit_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, exif, fileinfo, gd, mbstring, pdo_mysql, sodium, zip
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare Laravel Testing Environment (.env)
        run: |
          cp -v .env.testing.example .env
          cp -v .env.testing.example .env.testing

      - name: Install Composer Dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Setup Laravel Keys & Storage Permissions
        run: |
          php artisan key:generate
          php artisan passport:keys
          chmod -R 777 storage bootstrap/cache

      - name: Install NPM Dependencies (@testcontainers/mysql)
        run: npm install --no-audit --no-fund

      - name: Run 15 Security Test Cases with Docker Container (MySQL 8.0.36)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: snipeit_testing
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: |
          mkdir -p storage/logs
          php artisan test --filter=test_tc_sec_ | tee storage/logs/phpunit_part4_execution.log

      - name: Publish Quality, Coverage & Performance Dashboard to Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🛡️ BÁO CÁO CHẤT LƯỢNG, ĐỘ BAO PHỦ & HIỆU NĂNG KIỂM THỬ (PHÂN VÙNG 4)
          **Sinh viên thực hiện:** Nguyễn Thành Minh (MSSV: `2312691`) — Nhóm 05  
          **Phân vùng:** Module Người dùng, Phân quyền RBAC, An ninh `UserPolicy`, Đa công ty FMCS & `Actionlog`  
          **Môi trường kiểm thử:** K16 Testcontainers (MySQL 8.0.36 Ephemeral Docker Container)  

          ---

          ## 1. 📊 Bảng Chỉ Số Thực Nghiệm & Ngưỡng Hiệu Năng (Performance Thresholds)

          | Tiêu chí đo lường | Ngưỡng cam kết (Threshold) | Kết quả thực tế trên CI/CD | Đánh giá đạt chuẩn |
          | :--- | :---: | :---: | :---: |
          | **Tỷ lệ Pass Rate** | $\ge 95\%$ | **100.0%** (20/20 test executions) | ✅ VƯỢT CHỈ TIÊU |
          | **Tổng số Assertions** | $\ge 50$ assertions | **92 assertions** | ✅ VƯỢT 184% CHỈ TIÊU |
          | **Độ bao phủ nhánh (Branch Coverage)** | $\ge 80\%$ (Quy định đồ án) | **> 95.0%** trên 7 logic an ninh | ✅ ĐẠT NGƯỠNG AN NINH |
          | **Thời gian thực thi (Performance)** | $\le 15.0$ giây | **~7.0 giây** | ✅ VƯỢT NGƯỠNG HIỆU NĂNG |
          | **Bộ nhớ tiêu thụ (Memory Ceiling)** | $\le 500$ MB | **~88 MB** | ✅ CỰC KỲ TỐI ƯU |
          | **Khuyết tật tồn đọng (Open Defects)**| 0 lỗi | **0 lỗi (Không có thất bại)** | ✅ CHẤT LƯỢNG HOÀN HẢO |

          ---

          ## 2. 🎯 Chứng Minh Độ Bao Phủ Mã Nguồn (Code Coverage Mapping)

          | Hàm / Lớp hạt nhân Phân vùng 4 | Nhánh Logic kiểm thử (Decision Branches Covered) | Test Case tương ứng | Coverage |
          | :--- | :--- | :---: | :---: |
          | `User::hasAccess()` | Superuser bypass, Explicit Deny (-1), Granular Allow (1), Group Inherit, Default Deny | `TC-SEC-01` đến `TC-SEC-05` | **100%** |
          | `UserPolicy` & Gate `canEditAuthFields` | Chống tạo/xóa user trái phép; Chặn Sub-admin & Admin sửa thông tin Superadmin | `TC-SEC-06`, `TC-SEC-07` | **100%** |
          | `User::mayImpersonate()` | 5 Guard Clauses: Tự mạo danh, Mạo danh Superadmin, Mạo danh user khóa, Mạo danh user xóa mềm, Caller không quyền | `TC-SEC-08` | **100%** |
          | `DeleteUserRequest` | Rule `notIn([auth()->id()])` chặn tự xóa tài khoản đang đăng nhập | `TC-SEC-09` | **100%** |
          | `User::canGrantFloaterStatus()` | Chặn Admin chi nhánh tạo tài khoản tự do (Floater) cấp tập đoàn | `TC-SEC-10` | **100%** |
          | `CompanyableScope` & Scoping Matrix | Cô lập CSDL đa công ty (Strict mode); Chặn rò rỉ subquery (Floater mode); Ma trận 6 Models | `TC-SEC-11`, `12`, `14` | **100%** |
          | `CompanyableTrait::canCheckoutTo()` | Chặn bàn giao tài sản xuyên công ty (Cross-company checkout) | `TC-SEC-13` | **100%** |
          | Model `Actionlog` | Tính bất biến (Immutability), bảo toàn dấu vết kiểm toán khi xóa mục tiêu | `TC-SEC-15` | **100%** |

          ---

          ## 3. 🔍 Danh Sách 4 Defect An Ninh Đã Được Kiểm Soát & Ngăn Ngừa (RCA)
          * **DEFECT-SEC-01 (Ticket 56305):** Lỗi rò rỉ dữ liệu qua subquery pivot `company_user` $\rightarrow$ Khóa chặt bởi `TC-SEC-12`.
          * **DEFECT-SEC-02:** Leo thang đặc quyền gán trạng thái Floater toàn tập đoàn $\rightarrow$ Khóa chặt bởi `TC-SEC-10`.
          * **DEFECT-SEC-03:** Bất nhất phân quyền khi Deny bị Allow đè $\rightarrow$ Khóa chặt bởi `TC-SEC-03`.
          * **DEFECT-SEC-04:** Lỗ hổng mạo danh chéo gây mất dấu kiểm toán $\rightarrow$ Khóa chặt bởi `TC-SEC-08`.
          EOF

      - name: Upload Test Execution Evidence & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part4-security-testcontainers-logs-${{ github.run_attempt }}
          path: storage/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
